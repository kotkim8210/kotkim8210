name: 🗑️→🧠 Ingest (inbox 자동 수집)

# 데이터 수집기 + 연결 엔진: brain/inbox/에 새 자료가 push되면 자동으로 위키를 갱신한다.
on:
  push:
    paths:
      - "brain/inbox/**"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    # 봇 자신의 커밋으로 인한 무한 루프 방지
    if: github.actor != 'dream-sequence[bot]' && github.actor != 'github-actions[bot]'
    steps:
      - name: API 키 확인
        id: check
        env:
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "has_key=false" >> "$GITHUB_OUTPUT"
            echo "::warning::ANTHROPIC_API_KEY 시크릿이 없어 자동 수집을 건너뜁니다. 대화형 세션에서 /ingest 를 직접 실행하세요."
          else
            echo "has_key=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.check.outputs.has_key == 'true'
        uses: actions/checkout@v4

      - name: 🧠 수집 + 연결 (클로드)
        if: steps.check.outputs.has_key == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            너는 이 저장소의 제2의 뇌(Second Brain)를 위한 수집기 + 연결 엔진이다.
            `.claude/commands/ingest.md`의 절차를 그대로 따르고, `CLAUDE.md`의 규칙을 지켜라.

            brain/inbox/의 아직 처리되지 않은 파일을 스캔해:
            - brain/wiki/topics/ 에 주제 문서를 생성/갱신하고 [[위키링크]]로 연결
            - brain/wiki/MAP.md(지식 지도) 갱신
            - brain/.state/processed.json 에 처리 기록 추가

            파일 변경은 직접 수행하라. git 커밋은 하지 마라(이후 워크플로 단계가 커밋한다).
          claude_args: |
            --allowedTools Read,Write,Edit,Glob,Grep,Bash
            --max-turns 30

      - name: 변경 사항 커밋 & 푸시
        if: steps.check.outputs.has_key == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet && git diff --cached --quiet; then
            echo "수집할 새 내용 없음."
          else
            git add -A
            git commit -m "🧠 ingest: inbox 자동 수집 → 위키/지식지도 갱신"
            git push
          fi
