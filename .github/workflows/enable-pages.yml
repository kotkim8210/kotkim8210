name: Enable GitHub Pages

# 이 워크플로는 GitHub Pages를 "브랜치에서 배포(classic)" 방식으로 자동 활성화합니다.
# 작업 브랜치를 소스로 지정하므로 머지 없이 바로 라이브로 뜹니다.
# 한 번 켜지면 이후 이 브랜치 push마다 GitHub가 자동으로 다시 배포합니다.

on:
  push:
    branches: ["claude/tender-wright-hf5pq1"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write

jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - name: Enable Pages from this branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: claude/tender-wright-hf5pq1
        run: |
          set +e
          BODY="$(printf '{"source":{"branch":"%s","path":"/"}}' "$BRANCH")"
          echo "→ Pages 사이트 생성 시도(POST)…"
          echo "$BODY" | gh api --method POST -H "Accept: application/vnd.github+json" "/repos/$REPO/pages" --input -
          if [ $? -ne 0 ]; then
            echo "→ 이미 있을 수 있음. 소스 갱신 시도(PUT)…"
            echo "$BODY" | gh api --method PUT -H "Accept: application/vnd.github+json" "/repos/$REPO/pages" --input -
          fi
          echo "→ 현재 Pages 설정:"
          gh api "/repos/$REPO/pages" --jq '{status,html_url,source}' || echo "⚠️ Pages 미활성(권한 부족 가능). Settings→Pages에서 수동 토글 필요."
          echo "끝났습니다. 1~2분 후 https://kotkim8210.github.io/kotkim8210/ 확인."
          exit 0
