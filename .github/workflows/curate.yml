name: YouTube 큐레이터 (CC 떡상 → 숏츠)

# '안 봐도 알아서' — 매일 자동 실행. 수동 실행도 가능.
on:
  schedule:
    - cron: "0 21 * * *"   # 매일 06:00 KST (UTC 21:00)
  workflow_dispatch:
    inputs:
      only:
        description: "특정 카테고리 slug만 (예: worldcup)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  curate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: 준비물 설치 (ffmpeg + 한글폰트)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-nanum

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 파이썬 패키지
        run: pip install -r youtube-curator/requirements.txt

      - name: (선택) YouTube 쿠키 주입 — 봇 벽 100% 우회
        if: ${{ secrets.YT_COOKIES != '' }}
        run: printf '%s' "${{ secrets.YT_COOKIES }}" > /tmp/yt_cookies.txt

      - name: 큐레이션 실행
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # 있으면 LLM 하이라이트 선택
          YT_COOKIES_FILE: ${{ secrets.YT_COOKIES != '' && '/tmp/yt_cookies.txt' || '' }}
        run: |
          python youtube-curator/curate.py --per-category 1 \
            ${{ github.event.inputs.only != '' && format('--only {0}', github.event.inputs.only) || '' }}

      - name: 결과 숏츠 업로드 (아티팩트)
        uses: actions/upload-artifact@v4
        with:
          name: shorts-${{ github.run_id }}
          path: |
            youtube-curator/output/*.mp4
            youtube-curator/output/*.srt
            youtube-curator/output/*.txt
            youtube-curator/output/manifest.json
          if-no-files-found: warn
          retention-days: 14
