# 쇼츠→쇼츠: 카테고리별 '떡상 공식' + 소스(워치리스트).  ⚖️ 비-CC 소재라 권리 주의(출처표기·변형 전제).
# 떡상 공식은 주제마다 다르다 → 카테고리별 formula(편집 지시)를 두고, 성과 보며 여기만 수정해 다듬는다.
# sources: 모니터링할 크리에이터/해시태그 URL(자동 최신 수집). 급할 땐 CLI --urls 로 떡상 링크 직접 처리.
# lang: 원본 언어(zh=중국어). short_len: 목표 길이(초). caption: 설명란 머리말. model: 전사 모델(쇼츠는 작게=빠름).

categories:
  - name: 먹방/ASMR
    slug: mukbang
    lang: zh
    model: small
    short_len: 30
    sources: []          # 예: ["https://www.tiktok.com/@your_food_creator"]
    caption: "🍜 #먹방 #asmr #shorts"
    formula: |
      - 훅(0~1초): 가장 먹음직하거나 소리 큰 '한 입' 장면을 맨 앞에. 도입 설명/인사 금지.
      - 전개: 빠른 컷, 비주얼·사운드 중심. 군더더기 구간 제거.
      - 자막: 짧은 의성어·감탄("미쳤다","바삭","촉촉"). 한 컷에 1~2단어. 직역 금지.

  - name: 펫/동물
    slug: pet
    lang: zh
    model: small
    short_len: 25
    sources: []
    caption: "🐾 #반려동물 #shorts"
    formula: |
      - 훅: 가장 귀엽거나 웃긴 순간을 맨 앞에(반전·표정).
      - 전개: 감정 payoff로 마무리.
      - 자막: 동물 1인칭 더빙 톤("나 좀 봐줘","이건 못 참지"). 귀엽고 트렌디하게.

  - name: 생활꿀팁
    slug: lifehack
    lang: zh
    model: small
    short_len: 35
    sources: []
    caption: "💡 #꿀팁 #생활정보 #shorts"
    formula: |
      - 훅: '완성/결과(before→after의 after)'를 먼저 1~2초 teaser → 그다음 방법.
      - 자막: "이거 모르면 손해","3초 꿀팁" 식 후킹. 단계는 번호로 짧게.
      - 전개: 불필요한 설명 컷, 핵심 동작만.

  - name: 신기/충격
    slug: satisfying
    lang: zh
    model: small
    short_len: 25
    sources: []
    caption: "😮 #신기 #oddlysatisfying #shorts"
    formula: |
      - 훅: 가장 충격적·신기한 프레임을 맨 앞에.
      - 자막: 최소("헐","이게 된다고?","끝까지 봐"). 과한 설명 금지.
      - 전개: 긴장 유지, 클라이맥스는 살짝 뒤로 빼서 끝까지 보게.

  - name: 중드/드라마클립
    slug: cdrama
    lang: zh
    model: small
    short_len: 45
    sources: []
    caption: "🎬 #중드 #드라마 #shorts"
    formula: |
      - 훅: 절정(반전·고백·사이다) 직전을 맨 앞 클리프행어로.
      - 자막: 대사 번역 + 상황 설명 한 줄. 감정선 살린 한국어.
      - 전개: 맥락 → 절정 → 여운. 스포 과다 금지.
