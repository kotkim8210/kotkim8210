# 쇼츠→쇼츠: 카테고리별 '떡상 공식' + 소스(워치리스트).  ⚖️ 비-CC 소재라 권리 주의(출처표기·변형 전제).
# 떡상 공식은 주제마다 다르다 → 카테고리별 formula(편집 지시)를 두고, 성과 보며 여기만 수정해 다듬는다.
# sources: 모니터링할 크리에이터/해시태그 URL(자동 최신 수집). 급할 땐 CLI --urls 로 떡상 링크 직접 처리.
# lang: 원본 언어(zh=중국어). short_len: 목표 길이(초). caption: 설명란 머리말. model: 전사 모델(쇼츠는 작게=빠름).
#
# ── 튜닝 노브(LLM 편집기가 실제로 읽어 적용) ──
#   hook_sec      : 훅(맨 앞 끌리는 구간) 목표 길이(초). 첫 hook_sec 안에 가장 강한 한 방.
#   target_cuts   : 목표 컷 수(많을수록 빠른 호흡). 0/미설정이면 LLM 자율.
#   caption_chars : 한 컷 자막 최대 글자수(짧을수록 가독·체류↑).
#   pace          : 호흡 묘사(예: "1.5~3초 컷, 절대 늘어지지 않게").
#   cta           : 마무리 전략(루프/저장 유도 등 — 재생·저장이 랭킹을 올림).
#   retention     : 체류율 유지 전술(끝까지 보게 만드는 장치).
# 이 노브들은 카테고리별로 달라야 한다 = '떡상 공식'. 성과 데이터 보며 숫자/문구만 고쳐 계속 튜닝.

categories:
  # ───────────────────────────────────────────────────────────────────────────
  # 먹방/ASMR — ⭐ 정밀 튜닝 예시(레퍼런스). 다른 카테고리도 이 구조로 다듬는다.
  # 먹방 쇼츠 떡상 메커니즘(조사 요약):
  #   ① 사운드가 콘텐츠다 → 첫 컷은 '소리가 가장 큰 한 입'(치즈 늘어남·바삭·지글).
  #   ② 말 설명 0 → 비주얼+소리로만. 플레이팅·인사 컷.
  #   ③ 빠른 컷으로 '먹는 모멘텀' 유지, 절대 안 늘어지게.
  #   ④ 자막은 의성어·감탄 1~2단어(직역 금지) — 가독성이 곧 체류율.
  #   ⑤ 마지막 컷을 또 '한 입'으로 끝내 루프 → 반복재생(떡상 핵심 지표).
  # ───────────────────────────────────────────────────────────────────────────
  - name: 먹방/ASMR
    slug: mukbang
    lang: zh
    model: small
    short_len: 30
    hook_sec: 1.0
    target_cuts: 10
    caption_chars: 8
    pace: "1.5~3초 컷, 먹는 모멘텀이 끊기지 않게. 플레이팅/도입은 통째로 컷."
    cta: "마지막을 또 다른 '한 입' 클로즈업으로 끝내 루프 유도(반복재생)."
    retention: "사운드 큰 컷을 앞쪽에 몰고, 비주얼 임팩트(치즈 풀·국물·바삭)를 일정 간격으로 배치해 지루할 틈 제거."
    sources: []          # 예: ["https://www.tiktok.com/@your_food_creator"]
    caption: "🍜 #먹방 #asmr #shorts"
    formula: |
      - 훅(0~1초): 가장 먹음직하거나 소리 큰 '한 입'(치즈 늘어남·바삭·지글)을 맨 앞에. 도입 설명/인사/플레이팅 금지.
      - 전개: 1.5~3초 빠른 컷, 비주얼·사운드 중심. 먹는 모멘텀 유지, 군더더기·정적 구간 제거.
      - 자막: 짧은 의성어·감탄("미쳤다","겉바속촉","바삭","촉촉","이건 못참지"). 한 컷에 1~2단어, 8자 이내. 직역 금지.
      - 마무리: 또 한 입 클로즈업으로 끝내 첫 컷과 자연스럽게 루프(반복재생 유도).

  - name: 펫/동물
    slug: pet
    lang: zh
    model: small
    short_len: 25
    hook_sec: 1.0
    target_cuts: 6
    caption_chars: 10
    pace: "2~3초 컷, 코믹 타이밍 살려 한 박자 빠르게."
    cta: "마지막에 표정·반응 펀치라인 한 컷으로 빵 터뜨리며 끝."
    retention: "가장 귀엽/웃긴 반전을 앞에, 감정 payoff를 끝에 둬서 끝까지 보게."
    sources: []
    caption: "🐾 #반려동물 #shorts"
    formula: |
      - 훅: 가장 귀엽거나 웃긴 순간을 맨 앞에(반전·표정·예상밖 행동).
      - 전개: 코믹 타이밍 유지, 감정 payoff로 마무리.
      - 자막: 동물 1인칭 더빙 톤("나 좀 봐줘","이건 못 참지","엄마 어디가"). 귀엽고 트렌디하게, 10자 이내.

  - name: 생활꿀팁
    slug: lifehack
    lang: zh
    model: small
    short_len: 35
    hook_sec: 2.0
    target_cuts: 7
    caption_chars: 12
    pace: "동작 위주, 설명 컷. 단계마다 짧은 캡션."
    cta: "마무리에 '저장' 유도('저장해두면 진짜 씀') — 저장이 랭킹을 올림."
    retention: "결과(after)를 먼저 1~2초 teaser로 보여줘 '어떻게?' 궁금증을 만든 뒤 방법 공개."
    sources: []
    caption: "💡 #꿀팁 #생활정보 #shorts"
    formula: |
      - 훅(0~2초): '완성/결과(before→after의 after)'를 먼저 teaser → "어떻게?" 궁금증 유발 → 그다음 방법.
      - 자막: "이거 모르면 손해","3초 꿀팁" 식 후킹. 단계는 번호로 짧게(12자 이내).
      - 전개: 불필요한 설명 컷, 핵심 동작만. 마무리에 '저장해두세요' 한 줄(저장 유도).

  - name: 신기/충격
    slug: satisfying
    lang: zh
    model: small
    short_len: 25
    hook_sec: 1.0
    target_cuts: 5
    caption_chars: 8
    pace: "긴장 유지, 컷은 적게 길게 — 과정을 보게."
    cta: "끝까지 보면 보상(완성·반전)이 오게 클라이맥스를 뒤로."
    retention: "가장 충격/신기한 프레임을 앞에 미끼로, 클라이맥스는 살짝 뒤로 빼서 이탈 방지."
    sources: []
    caption: "😮 #신기 #oddlysatisfying #shorts"
    formula: |
      - 훅: 가장 충격적·신기한 프레임을 맨 앞에 미끼로.
      - 자막: 최소("헐","이게 된다고?","끝까지 봐"). 과한 설명 금지, 8자 이내.
      - 전개: 긴장 유지, 클라이맥스(완성·반전)는 살짝 뒤로 빼서 끝까지 보게.

  - name: 중드/드라마클립
    slug: cdrama
    lang: zh
    model: small
    short_len: 45
    hook_sec: 2.0
    target_cuts: 6
    caption_chars: 16
    pace: "맥락 → 절정 → 여운. 대사 호흡에 맞춰 컷."
    cta: "여운/다음편 궁금증으로 끝('다음이 더 미쳤음')."
    retention: "절정(반전·고백·사이다) 직전을 맨 앞 클리프행어로 걸어 결말이 궁금하게."
    sources: []
    caption: "🎬 #중드 #드라마 #shorts"
    formula: |
      - 훅: 절정(반전·고백·사이다) 직전을 맨 앞 클리프행어로.
      - 자막: 대사 번역 + 상황 설명 한 줄(16자 이내). 감정선 살린 한국어, 직역 금지.
      - 전개: 맥락 → 절정 → 여운. 스포 과다 금지, 다음편 궁금증으로 마무리.
